name: Build Android APK
on:
  workflow_call:
    inputs:
      release_run:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - run: npm ci
      - name: Prepare matching release version
        id: release
        env:
          GITHUB_RUN_NUMBER: ${{ inputs.release_run }}
        run: node scripts/prepare-release.mjs
      - name: Build ARM64 APK
        env:
          VITE_TOKO_ACCESS_KEY: ""
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          npm run android:build
      - name: Sign using the original Android installer key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-release.p12"
          printf '%s' "$ANDROID_KEYSTORE_PASSWORD" > "$RUNNER_TEMP/android-password.txt"
          mkdir -p release/android
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/android-release.p12" --ks-key-alias tokooffline --ks-pass "file:$RUNNER_TEMP/android-password.txt" --out "release/android/Toko-Offline-$RELEASE_VERSION-arm64.apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "release/android/Toko-Offline-$RELEASE_VERSION-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 "release/android/Toko-Offline-$RELEASE_VERSION-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: toko-offline-android-arm64
          path: release/android/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/android-release.p12" "$RUNNER_TEMP/android-password.txt"
